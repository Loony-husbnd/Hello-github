plugins {
    id 'com.android.application'
}

android {
    namespace 'com.foldersec.guard'
    compileSdk 34

    defaultConfig {
        applicationId 'com.foldersec.guard.tab'
        minSdk 29          // 갤럭시 탭 S6 Lite (Android 10 이상)
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lint { abortOnError false }
}
// 외부 라이브러리 의존성 없음 (APK 용량/메모리 최소화)
